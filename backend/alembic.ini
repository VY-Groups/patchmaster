# Alembic configuration for Patch-SecOps Solution (plan.md S0-4).
# Run from the backend directory:  python -m alembic upgrade head
[alembic]
# %(here)s is the directory holding this file, so the path works from any cwd.
script_location = %(here)s/alembic
# env.py reads DATABASE_URL from the environment first; this is the fallback
# for a bare `alembic` invocation outside the app (set it before use).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
